name: Validate Ondeck

on:
  push:
    branches: [main, "polish/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend syntax and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q api
      - run: |
          python - <<'PY'
          from api.index import app
          assert any(route.path == "/api/jobs" for route in app.routes)
          assert any(route.path == "/api" for route in app.routes)
          print("FastAPI app imports and expected routes are registered.")
          PY
